[config]
# Padrão PortMaster/dArkOS: segurar SELECT+START ~1s mata o processo alvo.
# É o mesmo mecanismo do MiniDayZ e de todos os ports - funciona mesmo se o
# Gamepad API do Chromium não enxergar o controle.
exit_combo = select+start
deadzone_mode = axial
deadzone_x = 8000
deadzone_y = 8000
deadzone_triggers = 3000
repeat_delay = 80
repeat_rate = 30
mouse_scale = 5000
mouse_delay = 16

[controls]
overlay = clear

# Sem mapeamento teclado/mouse por padrão: o jogo já suporta gamepad nativo
# (GamepadManager). Se o Gamepad API do NW não funcionar no hardware,
# descomentar o bloco abaixo (teclado sintético - mesmos keys do jogo).
#
# up = w
# down = s
# left = a
# right = d
# a = space
# b = f
# x = e
# y = r
# l1 = shift
# start = enter
# back = escape
